apiVersion: v1
kind: Pod
metadata:
  name: flint-mcp-server
  labels:
    app: flint-mcp-server
spec:
  containers:
    - name: flint-mcp-server
      image: ghcr.io/nyu-rts/flint-mcp
      ports:
        - containerPort: 8080
      resources:
        requests:
          cpu: 250m
          memory: 256M
        limits:
          cpu: "1"
          memory: 512M
